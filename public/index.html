<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10131f">
  <meta name="description" content="SkillPath AI — your personal learning companion.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SkillPath AI">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="lesson.css">
  <title>SkillPath AI — Learn with direction</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-page="overview">
        <span class="brand-mark">S</span><span>skillpath<span class="brand-ai">.ai</span></span>
      </a>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="nav-list">
        <button class="nav-item active" data-page="overview"><span class="nav-icon">⌂</span>Overview</button>
        <button class="nav-item" data-page="roadmap"><span class="nav-icon">⌁</span>My roadmap</button>
        <button class="nav-item" data-page="courses"><span class="nav-icon">▤</span>Explore courses</button>
        <button class="nav-item" data-page="practice"><span class="nav-icon">⌘</span>Practice lab</button>
        <button class="nav-item" data-page="tutor"><span class="nav-icon">✳</span>AI tutor <span class="new-tag">AI</span></button>
        <button class="nav-item" data-page="projects"><span class="nav-icon">▧</span>Projects</button>
        <button class="nav-item" data-page="analytics"><span class="nav-icon">▥</span>Analytics</button>
      </nav>
      <div class="workspace-label second-label">PERSONAL</div>
      <nav class="nav-list">
        <button class="nav-item" data-page="profile"><span class="nav-icon">◎</span>My profile</button>
        <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>Settings</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="upgrade-card">
          <div class="upgrade-icon">✦</div>
          <strong>Your next level awaits</strong>
          <p>Small steps. Real progress. Keep going.</p>
          <button data-page="roadmap" class="upgrade-link">View my roadmap <span>→</span></button>
        </div>
        <div class="user-mini">
          <div class="avatar">AM</div>
          <div><strong>Alex Morgan</strong><small>Free learner</small></div>
          <button class="more-btn" aria-label="Profile options" data-page="profile">···</button>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
        <div class="breadcrumb"><span>Workspace</span><b>/</b><strong id="pageLabel">Overview</strong></div>
        <div class="top-actions">
          <div class="search-wrap"><span>⌕</span><input id="globalSearch" placeholder="Search anything..." aria-label="Search"><kbd>⌘ K</kbd></div>
          <button class="icon-button" id="installButton" title="Install SkillPath AI" aria-label="Install SkillPath AI">⇩</button>
          <button class="icon-button notification-button" id="notifyButton" title="Notifications">♧<i></i></button>
          <button class="top-avatar" data-page="profile">AM</button>
        </div>
      </header>
      <div id="content" class="content-area"></div>
      <footer class="footer"><span>© 2025 SkillPath AI</span><span>Built for curious minds <b>✦</b></span><span>Learning is a journey, not a race.</span></footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="lessons.js"></script>
  <script src="app.js"></script>
</body>
</html>
